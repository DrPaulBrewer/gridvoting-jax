          file: Dockerfiles/dev/Dockerfile.dev-cpu
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}/dev/cpu:latest

  build-dev-cuda12:
