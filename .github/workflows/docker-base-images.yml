name: Build Base Docker Images

on:
  push:
    branches:
      - 'main'
    paths:
      - 'Dockerfiles/base/**'
      - 'Dockerfiles/download_data.py'
      - 'requirements.txt'
      - 'Dockerfiles/dev/**'
      - 'requirements-dev.txt'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base: ${{ steps.filter.outputs.base }}
      dev: ${{ steps.filter.outputs.dev }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            base:
              - 'Dockerfiles/base/**'
              - 'Dockerfiles/download_data.py'
              - 'requirements.txt'
            dev:
              - 'Dockerfiles/dev/**'
              - 'requirements-dev.txt'

  build-base-cpu:
    needs: changes
    if: ${{ needs.changes.outputs.base == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set lowercase repository name
        id: repo
        run: echo "repository=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push base CPU image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfiles/base/Dockerfile.jax-cpu
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}/base/cpu:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}/base/cpu:latest
          cache-to: type=inline

  build-base-cuda12:
    needs: changes
    if: ${{ needs.changes.outputs.base == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set lowercase repository name
        id: repo
        run: echo "repository=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push base CUDA 12 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfiles/base/Dockerfile.jax-cuda12
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}/base/cuda12:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}/base/cuda12:latest
          cache-to: type=inline

  build-base-cuda13:
