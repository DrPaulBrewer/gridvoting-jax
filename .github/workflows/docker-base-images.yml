      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set lowercase repository name
        id: repo
        run: echo "repository=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push dev CUDA 12 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfiles/dev/Dockerfile.dev-cuda12
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}/dev/cuda12:latest

  build-dev-cuda13:
    needs: [build-base-cuda13, changes]
    if: ${{ always() && (needs.changes.outputs.base == 'true' || needs.changes.outputs.dev == 'true' || github.event_name == 'workflow_dispatch') && (needs.build-base-cuda13.result == 'success' || needs.build-base-cuda13.result == 'skipped') }}
