          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.repository }}/base/cuda13:latest
          cache-to: type=inline

  build-dev-cpu:
    needs: [build-base-cpu, changes]
    if: ${{ always() && (needs.changes.outputs.base == 'true' || needs.changes.outputs.dev == 'true' || github.event_name == 'workflow_dispatch') && (needs.build-base-cpu.result == 'success' || needs.build-base-cpu.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set lowercase repository name
        id: repo
        run: echo "repository=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
